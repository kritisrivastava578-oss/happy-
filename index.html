<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f3ef;
            --card-bg: #ffffff;
            --text-main: #4a4238;
            --accent-gold: #d4af37;
            --pastel-pink: #f4e8e1;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(74, 66, 56, 0.08);
            max-width: 380px;
            width: 90%;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .photo-frame {
            width: 160px;
            height: 160px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--accent-gold);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 600;
            color: #332c25;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            font-weight: 300;
            line-height: 1.6;
            color: #6b6053;
            margin-bottom: 25px;
        }

        .tag {
            display: inline-block;
            background: var(--pastel-pink);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            letter-spacing: 1px;
            color: #7a685e;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="photo-frame">
            <!-- Yahan apni photo ka exact file name likh dena -->
            <img src="Screenshot_1-11-2026_11657_in.pinterest.com.jpeg" alt="Birthday Special">
        </div>
        
        <span class="tag">SPECIAL DAY</span>
        <h1>Happy Birthday! ✨</h1>
        <p>Wishing you a day filled with endless joy, beautiful moments, and all the success you deserve.</p>
    </div>

</body>
</html>
